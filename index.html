<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<meta name="description" content="メンタルヘルス・マネジメント検定の問題集を解きながら、1〜4 の回答をスマホで記録する回答シート。記録は回ごとに保存し、あとで○付けできます。">
<!-- ホーム画面に追加すると、アドレスバーのない全画面で動きます -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MH回答シート">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>メンタルヘルス・マネジメント 2026 回答シート</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f3f6f5; --card:#ffffff; --ink:#17221f; --sub:#5a6b66; --faint:#8e9d98;
    --line:#dce4e1; --soft:#ebf1ef;
    --accent:#23796a; --accent-ink:#ffffff; --accent-soft:#dbeee8;
    --ok:#1f8a4c; --ok-soft:#e0f3e7; --ng:#c8433a; --ng-soft:#fbe7e4; --warn:#c08412;
    --unsure:#a16500; --unsure-ink:#ffffff;
    --pen:#d7332a;
    --shadow:0 1px 2px rgba(18,44,38,.06), 0 6px 18px rgba(18,44,38,.07);
    --r:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1513; --card:#18201d; --ink:#e4ece9; --sub:#9aaba6; --faint:#6d7d78;
      --line:#2a3632; --soft:#1f2925;
      --accent:#4cb59f; --accent-ink:#06201a; --accent-soft:#1c3630;
      --ok:#5cc485; --ok-soft:#173326; --ng:#f07468; --ng-soft:#3a1d1a; --warn:#e0a93c;
      --unsure:#e0a93c; --unsure-ink:#241a04;
      --pen:#ff6f61;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink); min-height:100dvh;
    font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
    font-size:16px; line-height:1.5;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;
         touch-action:manipulation; -webkit-user-select:none; user-select:none}
  button:disabled{cursor:default; opacity:.35}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  svg{display:block}
  .num{font-variant-numeric:tabular-nums}

  #view{
    max-width:560px; margin:0 auto;
    padding:0 max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  /* ---- 上のバー ---- */
  .bar{
    position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:4px;
    margin:0 -16px 4px; padding:calc(6px + env(safe-area-inset-top)) 8px 6px;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .icon-btn{width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:12px; color:var(--sub)}
  .icon-btn:active{background:var(--soft)}
  .icon-btn svg{width:24px; height:24px}
  .bar-title{flex:1; min-width:0; text-align:center; line-height:1.3}
  .bar-title b{display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bar-title small{display:block; font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bar-end{flex:none; min-width:44px; height:34px; padding:0 12px; border-radius:99px; background:var(--soft);
           font-size:14px; font-weight:700; color:var(--sub)}
  .bar-end:active{filter:brightness(.95)}

  /* ---- ホーム ---- */
  .hero{padding:calc(32px + env(safe-area-inset-top)) 4px 4px}
  .eyebrow{font-size:13px; font-weight:600; color:var(--accent); letter-spacing:.04em}
  .hero h1{font-size:28px; line-height:1.25; margin-top:2px}
  /* 問題集の切り替え */
  .books{display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:14px; padding:4px; border-radius:14px; background:var(--soft)}
  .books button{height:40px; border-radius:10px; font-size:15px; font-weight:600; color:var(--sub)}
  .books button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
  .lead{font-size:14px; color:var(--sub); margin-top:8px}
  .nw{white-space:nowrap}

  .sec{display:flex; align-items:center; gap:8px; margin:28px 4px 10px;
       font-size:13px; font-weight:600; color:var(--sub); letter-spacing:.04em}
  .pill{font-size:12px; padding:0 8px; border-radius:99px; background:var(--soft); color:var(--sub)}

  .big{
    width:100%; margin-top:16px; padding:16px 18px; display:flex; align-items:center; gap:14px; text-align:left;
    border-radius:var(--r); box-shadow:var(--shadow); transition:transform .08s;
  }
  .big:active{transform:scale(.985)}
  .big .ico{width:42px; height:42px; flex:none; display:grid; place-items:center; border-radius:50%;
            background:rgba(255,255,255,.18)}
  .big .ico svg{width:22px; height:22px}
  .big b{display:block; font-size:17px}
  .big small{display:block; font-size:13px; opacity:.85}
  .primary.big{background:var(--accent); color:var(--accent-ink)}
  .big.alt{margin-top:10px; background:var(--card); border:1px solid var(--line)}
  .big.alt .ico{background:var(--accent-soft); color:var(--accent)}
  .big.alt small{color:var(--sub); opacity:1}
  .sec-note{margin-left:auto; font-size:12px; font-weight:400; letter-spacing:0; color:var(--faint)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}

  .session{margin-bottom:12px; overflow:hidden}
  .session-main{display:block; width:100%; text-align:left; padding:14px 16px 12px}
  .session-main:active{background:var(--soft)}
  .session-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .session-date{font-size:17px}
  .tag{display:inline-block; margin-left:8px; padding:1px 8px; border-radius:99px; vertical-align:2px;
       font-size:12px; font-weight:600; background:var(--accent-soft); color:var(--accent)}
  .tag + .tag{margin-left:4px}
  .tag.off{background:var(--soft); color:var(--sub)}
  .session-top svg{width:20px; height:20px; flex:none; color:var(--faint)}
  .session-sub{font-size:12.5px; color:var(--sub); margin-top:2px}
  .progress{height:6px; margin:12px 0 8px; border-radius:99px; background:var(--soft); overflow:hidden}
  .progress i{display:block; height:100%; border-radius:inherit; background:var(--accent)}
  .session-stats{display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 12px; font-size:13px; color:var(--sub)}
  .session-stats b{font-size:15px; color:var(--ink)}
  .session-actions{display:flex; border-top:1px solid var(--line)}
  .session-actions button{flex:1; padding:12px 8px; font-size:14px; font-weight:600; color:var(--accent)}
  .session-actions button + button{border-left:1px solid var(--line)}
  .session-actions button:active{background:var(--soft)}
  .session-actions .danger{flex:0 0 56px; display:grid; place-items:center; color:var(--faint)}
  .session-actions .danger svg{width:20px; height:20px}

  .empty{padding:28px 16px; text-align:center; color:var(--sub); font-size:14px;
         border:1.5px dashed var(--line); border-radius:var(--r)}
  .foot{margin:24px 4px 0; font-size:12px; color:var(--faint); line-height:1.7}

  /* ---- どこから解く ---- */
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .secondary{padding:12px; border-radius:14px; background:var(--card); border:1px solid var(--line);
             font-size:15px; font-weight:600; color:var(--accent)}
  .secondary:active{background:var(--soft)}
  .ch{margin-bottom:12px; padding:12px}
  .ch-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:0 2px 8px}
  .ch-head b{font-size:15px}
  .ch-head span{font-size:13px; color:var(--sub)}
  .blocks{display:grid; grid-template-columns:repeat(5, 1fr); gap:6px}
  .blk{padding:8px 2px 7px; border-radius:10px; background:var(--soft); border:1.5px solid transparent; text-align:center}
  .blk:active{filter:brightness(.96)}
  .blk-range{display:block; font-size:13.5px; font-weight:600}
  .blk-bar{display:block; height:4px; margin:6px 6px 4px; border-radius:99px; background:var(--line); overflow:hidden}
  .blk-bar i{display:block; height:100%; background:var(--accent)}
  .blk-count{display:block; font-size:11px; color:var(--sub)}
  .blk.full{background:var(--accent-soft)}
  .blk.full .blk-count{color:var(--accent); font-weight:600}
  .blk.here{border-color:var(--accent)}

  /* ---- 回答画面 ---- */
  html[data-view="q"], html[data-view="q"] body{height:100%; overflow:hidden; overscroll-behavior:none}
  .ans{
    position:fixed; inset:0; max-width:560px; margin:0 auto; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  .ans > .bar{position:static; margin:0 -4px; padding:6px 0; background:none; -webkit-backdrop-filter:none; backdrop-filter:none}
  /* 問題番号は空いた所の中央に。ストリップと選択肢は下（親指の届く位置）に寄せる */
  .qhead{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:2px 0 10px}
  .qnum{font-size:clamp(52px, 17vw, 80px); font-weight:700; line-height:1.05; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .qnum .q-label{font-size:.36em; font-weight:600; color:var(--sub); margin-right:.15em; letter-spacing:0}
  .qnum .q-of{font-size:.3em; font-weight:500; color:var(--faint); margin-left:.3em; letter-spacing:0}
  .qnum.enter{animation:pop .22s ease-out}
  @keyframes pop{from{opacity:.25; transform:translateY(6px)} to{opacity:1; transform:none}}
  .qmeta{font-size:12.5px; color:var(--sub); margin-top:2px}
  .strip{display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; margin-bottom:12px}
  .cell{height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;
        border-radius:9px; background:var(--soft); border:1.5px solid transparent}
  .cell small{font-size:10px; color:var(--faint)}
  .cell b{font-size:15px; min-height:1.15em; color:var(--accent)}
  .cell.cur{border-color:var(--accent); background:var(--accent-soft)}
  .choices{flex:none; height:clamp(110px, 21vh, 180px); height:clamp(110px, 21dvh, 180px);
           display:grid; grid-template-columns:repeat(4, 1fr); gap:10px}
  .choice{
    display:grid; place-items:center; border-radius:18px;
    background:var(--card); border:2px solid var(--line); box-shadow:var(--shadow);
    font-size:clamp(36px, 11vw, 56px); font-weight:700; font-variant-numeric:tabular-nums;
    transition:transform .08s, background-color .12s, border-color .12s, color .12s;
  }
  .choice:active{transform:scale(.97)}
  .choice.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .qnav{display:grid; grid-template-columns:1fr auto auto 1fr; grid-template-areas:"prev clr uns nxt"; gap:8px; margin-top:12px}
  .qnav [data-act="prev"]{grid-area:prev}
  .qnav [data-act="clear"]{grid-area:clr}
  .qnav [data-act="unsure"]{grid-area:uns}
  .qnav [data-act="next"]{grid-area:nxt}
  .nav-btn{height:52px; display:flex; align-items:center; justify-content:center; gap:4px;
           border-radius:14px; background:var(--card); border:1px solid var(--line); font-size:15px; font-weight:600}
  .nav-btn:active{background:var(--soft)}
  .nav-btn svg{width:20px; height:20px}
  .nav-btn.ghost{padding:0 10px; background:none; border-color:transparent; font-size:14px; color:var(--sub)}
  /* 自信なし: 回答とは別に付け外しする印（押すと塗りつぶし） */
  .nav-btn.unsure{gap:5px; padding:0 12px; color:var(--unsure)}
  .nav-btn.unsure.on{background:var(--unsure); border-color:var(--unsure); color:var(--unsure-ink)}
  .nav-btn.unsure.on .ub{background:var(--unsure-ink); color:var(--unsure)}
  @media (max-width:359px){ .nav-btn.unsure .ub{display:none} }
  /* 自信なしの印「?」 */
  .ub{display:inline-block; width:15px; height:15px; border-radius:50%; background:var(--unsure); color:var(--unsure-ink);
      font-size:11px; font-weight:700; font-style:normal; line-height:15px; text-align:center; vertical-align:2px}
  .cell .ub{width:12px; height:12px; margin-left:1px; font-size:9.5px; line-height:12px; vertical-align:1px}
  .hint .ub{margin:0 2px; vertical-align:1px}
  /* 横向きなど背の低い画面では、問題番号を1行にまとめ、選択肢を残りの高さいっぱいに */
  @media (max-height:560px){
    .qhead{flex:none; flex-direction:row; align-items:baseline; justify-content:center; gap:14px; padding:0 0 6px}
    .qnum{font-size:40px}
    .strip{margin-bottom:8px}
    .cell{height:38px}
    .choices{flex:1; min-height:0; height:auto}
    .qnav{margin-top:8px}
    .nav-btn{height:44px}
  }

  /* ---- 問題文（紙面）と手書きメモ ----
   * 紙面は幅を固定（--paper-w）して組み、画面の幅に合わせて拡大・縮小する。
   * 画面の幅や向きが変わっても文字の位置が変わらないので、手書きメモがずれない */
  .ans.has-paper .choices{height:clamp(60px, 10vh, 88px); height:clamp(60px, 10dvh, 88px)}
  .ans.has-paper .choice{font-size:clamp(28px, 8vw, 40px); border-radius:16px}
  .ans.has-paper .cell{height:40px}
  .ans.has-paper .strip{margin-bottom:10px}
  .qarea{position:relative; flex:1; min-height:0; margin:2px -4px 10px}
  .qscroll{position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
           border-radius:14px; background:var(--card); border:1.5px solid var(--line); scrollbar-gutter:stable}
  .qscroll .qsizer{animation:fade .18s ease-out}
  .qarea.inking .qscroll{border-color:var(--pen); overflow:hidden; touch-action:none}   /* ペンのあいだは動かさない */
  .qcard{margin-bottom:12px; overflow:hidden}
  .qsizer{position:relative; margin:0 auto}
  .paper{position:absolute; left:0; top:0; width:344px; transform-origin:0 0; padding:12px 14px 16px;
         font-size:15px; line-height:1.7; overflow-wrap:anywhere}
  .qarea .paper{padding-bottom:64px}   /* 右下のペンのボタンに隠れないように */
  .pp-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .pp-head b{padding:1px 10px; border-radius:8px; background:var(--ink); color:var(--card); font-size:14px; letter-spacing:.04em}
  .pp-head span{margin-left:auto; font-size:11px; color:var(--faint); text-align:right; line-height:1.4}
  .pp-stem{padding:9px 12px; border-radius:10px; background:var(--soft); font-weight:600; line-height:1.65}
  .pp-stem u, .pp-body u, .pp-choices u{text-decoration-thickness:1.5px; text-underline-offset:3px}
  .pp-body{margin-top:8px}
  .pp-item{display:grid; grid-template-columns:1.6em 1fr; padding:4px 0}
  .pp-mark{font-weight:700; color:var(--accent)}
  .pp-para{margin:6px 0; text-indent:1em}
  .pp-choices{margin-top:8px; padding-top:6px; border-top:1px dashed var(--line)}
  .pp-choices .pp-item{margin:0 -8px; padding:5px 8px; border-radius:8px}
  .pp-cells{display:grid; gap:1px}
  .pp-lab{display:inline-block; min-width:1.4em; margin-right:.4em; text-align:center; font-weight:700; color:var(--sub)}
  .qblank{display:inline-block; min-width:2em; margin:0 .15em; padding:0 .3em; border:1.5px solid var(--sub); border-radius:4px;
          text-align:center; font-weight:700; font-size:.9em; line-height:1.35; text-indent:0}
  .pp-lab .qblank{margin:0}
  .pp-grid{border-collapse:collapse; margin:0 -8px}
  .pp-grid th, .pp-grid td{padding:3px 9px; text-align:center; white-space:nowrap}
  .pp-grid thead th{font-size:13px; color:var(--sub)}
  .pp-grid tbody th{color:var(--accent); text-align:left}
  .pp-grid td.pp-x{font-size:1.3em; line-height:1.3}   /* × は ○ より小さく見えるので大きめに */
  .pp-grid tbody tr > *:first-child{border-radius:8px 0 0 8px}
  .pp-grid tbody tr > *:last-child{border-radius:0 8px 8px 0}
  .pp-table{width:100%; margin:6px 0; border-collapse:collapse; font-size:13.5px; line-height:1.55}
  .pp-table th, .pp-table td{padding:5px 7px; border:1px solid var(--line); vertical-align:top; text-align:left}
  .pp-table th{background:var(--soft); font-weight:600}
  .pp-table caption{padding:0 0 4px; font-weight:700; text-align:left}
  .pp-figure{margin:8px 0}
  .pp-figure svg{width:100%; height:auto; overflow:visible}
  .pp-none{padding:40px 0; text-align:center; color:var(--faint); font-size:14px}
  /* 自分の答え（回答画面）・正解と× （解説画面） */
  .pp-choices .picked{background:var(--accent-soft)}
  .pp-choices .is-ok{background:var(--ok-soft)}
  .pp-choices .is-ng{background:var(--ng-soft)}
  .ink{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none}
  .ink path{fill:none; stroke:var(--pen); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .inking .paper{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  .inking .ink{pointer-events:auto; touch-action:none; cursor:crosshair}
  .inkbar{position:absolute; right:8px; bottom:8px; z-index:2; display:flex; gap:2px; padding:3px; border-radius:99px;
          background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
  .inkbar button{position:relative; width:42px; height:42px; display:grid; place-items:center; border-radius:50%; color:var(--sub)}
  .inkbar button:active{background:var(--soft)}
  .inkbar button.on{background:var(--pen); color:#fff}
  .inkbar svg{width:21px; height:21px}
  .inkbar .more{display:none}
  .inking .inkbar .more{display:grid}
  .ink-dot{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--pen)}
  .inking .ink-dot{display:none}
  /* 横向きの背の低い画面では、左に問題・右に回答ボタン */
  @media (max-height:560px) and (orientation:landscape){
    .ans.has-paper{max-width:1000px; display:grid; column-gap:14px;
                   grid-template-columns:minmax(0, 1.35fr) minmax(220px, 1fr); grid-template-rows:auto auto minmax(0, 1fr) auto}
    .ans.has-paper > .bar{grid-column:1 / -1}
    .ans.has-paper .qarea{grid-column:1; grid-row:2 / 5; margin:0 0 0 -4px}
    .ans.has-paper .strip{grid-column:2; grid-row:2}
    .ans.has-paper .choices{grid-column:2; grid-row:3; height:auto; min-height:0}
    .ans.has-paper .qnav{grid-column:2; grid-row:4; grid-template-columns:1fr 1fr; grid-template-areas:"clr uns" "prev nxt"}
  }

  /* ---- 回答一覧・○付け ---- */
  .hint{font-size:13px; color:var(--sub); margin:4px 4px 12px}
  .lgrid{display:grid; grid-template-columns:repeat(5, 1fr); gap:6px}
  .lgrid + .lgrid{margin-top:10px}
  @media (min-width:520px){ .lgrid{grid-template-columns:repeat(10, 1fr)} }
  .acell{position:relative; min-height:56px; padding:5px 0; display:flex; flex-direction:column; align-items:center; justify-content:center;
         line-height:1.2; border-radius:10px; background:var(--soft)}
  .acell .ub{position:absolute; top:4px; right:4px}
  button.acell:active{filter:brightness(.95)}
  .acell small{font-size:11px; color:var(--faint)}
  .acell b{font-size:20px; font-variant-numeric:tabular-nums}
  .acell .sub{font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums}
  .acell.blank b{font-weight:400; color:var(--faint)}
  .acell.ok{background:var(--ok-soft)}
  .acell.ok b{color:var(--ok)}
  .acell.ng{background:var(--ng-soft)}
  .acell.ng b{color:var(--ng)}
  .acell.ng .sub{color:var(--ng); font-weight:600}

<body>
<div id="view"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">JavaScript を有効にしてください。</p></noscript>
<script>
'use strict';

/* ===== 問題集 =====
 * 2冊を切り替えて使う。開いている問題集は localStorage（mhm2026-book）に覚え、切り替えたら読み込み直す。
 * 記録・正解データ・問題文と解説は問題集ごとに別の場所に保存する（1冊目は前からの mhm2026-… のまま）。
 *   chapters  各章の問題数
 *   store     保存場所の名前の頭
 *   explain   問題文・解説の暗号化ファイル
 */
const BOOKS = {
  1: { name: '過去問題集', chapters: [46, 15, 15, 41, 30, 23, 19], store: 'mhm2026', explain: 'explain.bin' },
  2: { name: 'テキスト問題集', chapters: [50, 33, 24, 41, 37, 26, 23], store: 'mhm2026-b2', explain: 'explain2.bin' },
};
const BOOK_STORE = 'mhm2026-book';
const BOOK_ID = (() => { try { return localStorage.getItem(BOOK_STORE) === '2' ? 2 : 1; } catch (e) { return 1; } })();
const BOOK = BOOKS[BOOK_ID];

// 問題集を切り替える（hash を残して読み込み直す。取り込み用リンクで開いたときも、この後で取り込む）
function switchBook(id, hash = '#/') {
  try {
    localStorage.setItem(BOOK_STORE, String(id));
    if (localStorage.getItem(BOOK_STORE) !== String(id)) return false;
  } catch (e) {
    return false;   // 保存できないと読み込み直しても切り替わらないので、何もしない
  }
  history.replaceState(null, '', hash);
  location.reload();
  return true;
}

/* ===== 問題集の構成 ===== */
const CHAPTERS = BOOK.chapters;                          // 各章の問題数
const TOTAL = CHAPTERS.reduce((a, b) => a + b, 0);       // 過去問題集は189問
const BLOCK = 10;                                        // 「どこから解くか」を選ぶ単位
const PASS = 70;                                         // 合格の目安（%）
const MOCK_N = 50;                                       // 実戦形式の問題数
const MOCK_MIN = 120;                                    // 実戦形式の時間の目安（分）。本試験の試験時間

// 実戦形式の章ごとの出題数。各章の問題数の比で MOCK_N 問を割り振る（端数は大きい章から +1）→ [12,4,4,11,8,6,5]
const MOCK_QUOTA = (() => {
  const exact = CHAPTERS.map(n => n * MOCK_N / TOTAL), quota = exact.map(Math.floor);
  const rest = MOCK_N - quota.reduce((a, b) => a + b, 0);
  exact.map((x, c) => [x - quota[c], c]).sort((a, b) => b[0] - a[0]).slice(0, rest).forEach(([, c]) => quota[c]++);
  return quota;
})();

/* ===== 正解データ =====
 * アプリには埋め込まない（公開リポジトリに載せないため）。
 * 端末ごとに「正解データ」画面か取り込み用リンク（…#key=…）で取り込み、localStorage に保存する。
 * KEY[章][問] = 1〜4（0 は正解不明）。章ごと未登録なら null
 */
const KEY_STORE = `${BOOK.store}-key`;
let KEY = loadKey();
let HAS_KEY = KEY.some(Boolean);

function loadKey() {
  try {
    const data = JSON.parse(localStorage.getItem(KEY_STORE));
    if (data && Array.isArray(data.chapters)) {
      return CHAPTERS.map((n, c) => {
        const a = data.chapters[c];
        return Array.isArray(a) && a.length === n ? a.map(v => (v >= 1 && v <= 4 ? v : 0)) : null;
      });
    }
  } catch (e) { /* 読めなければ未登録として扱う */ }
  return CHAPTERS.map(() => null);
}

function saveKey(next) {
  try {
    localStorage.setItem(KEY_STORE, JSON.stringify({ v: 1, chapters: next }));
  } catch (e) {
    toast('保存できませんでした');
    return false;
  }
  KEY = next;
  HAS_KEY = KEY.some(Boolean);
  return true;
}

/* ===== 解説データ =====
 * 解説の文章も公開リポジトリには平文で置かない。AES-GCM で暗号化した explain.bin だけを置き、
 * 取り込み用リンクの「ex=…」（鍵）で端末ごとに復号して localStorage に保存する。
 * explain.bin = IV(12バイト) + 暗号文。中身は { built, items: { '章-問': { answer, blocks: [...] } } }
 * テキスト問題集は explain2.bin（取り込み用リンクに b=2 が付く）
 */
const EX_STORE = `${BOOK.store}-ex`;
const EXKEY_STORE = `${BOOK.store}-exkey`;
let EX = loadEx();

function loadEx() {
  try {
    const data = JSON.parse(localStorage.getItem(EX_STORE));
    if (data && data.items && typeof data.items === 'object') return data;
  } catch (e) { /* 読めなければ未登録として扱う */ }
  return null;
}

function getExKey() {
  try { return localStorage.getItem(EXKEY_STORE); } catch (e) { return null; }
}

async function fetchExplain(keyText) {
  if (!(window.crypto && crypto.subtle)) throw new Error('この開き方では解説を読み込めません（https のページで開いてください）');
  const res = await fetch(BOOK.explain, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`解説ファイルを取得できませんでした（${res.status}）`);
  const buf = new Uint8Array(await res.arrayBuffer());
  const b64 = keyText.replace(/-/g, '+').replace(/_/g, '/');
  const raw = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), ch => ch.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  let plain;
  try {
    plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  } catch (e) {
    throw new Error('鍵が合わないため、解説を開けませんでした');
  }
  const data = JSON.parse(new TextDecoder().decode(plain));
  if (!data || !data.items || typeof data.items !== 'object') throw new Error('解説ファイルの形式が正しくありません');
  return data;
}

function saveEx(data, keyText) {
  try {
    localStorage.setItem(EX_STORE, JSON.stringify(data));
    localStorage.setItem(EXKEY_STORE, keyText);
  } catch (e) {
    toast('解説を保存できませんでした');
    return false;
  }
  EX = data;
  return true;
}

/* 正解データの読み取り。受け付ける形:
 *   ・189問ぶんを続けて（空白・改行・区切りは自由）  例）3142231441 2314...
 *   ・章ごとの行で「第1章: …」「1: …」             → 書いた章だけを更新する
 *   ・取り込み用リンク（…#key=3142…）をそのまま
 * 正解不明の問題は「-」（「?」「ー」も可）。全角数字も可。
 * 戻り値: { chapters: [章ごとの配列。書かれていない章は undefined] } か { error: '…' }
 */
function parseKey(text) {
  let src = String(text);
  const link = src.match(/key=([^\s#&]+)/);
  if (link) {
    try { src = decodeURIComponent(link[1]); } catch (e) { src = link[1]; }
  }
  src = src.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
           .replace(/[?？ー－―]/g, '-');
  const marks = s => s.replace(/[（(][^）)]*[）)]/g, '').replace(/[^1-4-]/g, '');
  const toArray = s => [...s].map(ch => (ch === '-' ? 0 : Number(ch)));
  const lines = src.split(/\r?\n/);
  const head = /^\s*(?:第\s*([1-7])\s*章\s*[:：]?|([1-7])\s*[:：.．)）])/;

  const chapters = CHAPTERS.map(() => undefined);
  if (lines.some(l => head.test(l))) {
    // 章ごとの行。次の章の行までは同じ章の続きとして読む（最初の章より前の行は見出しとして無視）
    const buf = CHAPTERS.map(() => null);
    let c = -1;
    for (const line of lines) {
      const m = line.match(head);
      if (m) {
        c = Number(m[1] || m[2]) - 1;
        buf[c] = (buf[c] || '') + marks(line.slice(m[0].length));
      } else if (c >= 0) {
        buf[c] += marks(line);
      }
    }
    for (let i = 0; i < CHAPTERS.length; i++) {
      if (buf[i] === null) continue;
      if (buf[i].length !== CHAPTERS[i]) return { error: `第${i + 1}章が ${buf[i].length}問ぶんあります（${CHAPTERS[i]}問のはずです）。` };
      chapters[i] = toArray(buf[i]);
    }
  } else {
    // 全問ぶんを続けて
    const all = marks(src);
    if (!all) return { error: '正解の数字（1〜4）が見つかりません。' };
    if (all.length !== TOTAL) return { error: `${all.length}問ぶんあります（全${TOTAL}問のはずです）。章ごとに入れる場合は「第1章: …」のように書いてください。` };
    let i = 0;
    CHAPTERS.forEach((n, c) => { chapters[c] = toArray(all.slice(i, i + n)); i += n; });
  }
  return { chapters };
}

/* ===== 保存 =====
 * 1回分の記録（session）:
 *   createdAt  「新しく解きはじめる」を押した時刻
 *   startedAt  最初に回答した時刻。この回の日付として表示する
 *   answers    answers[章][問] = 1〜4、未回答は 0
 *   unsure     unsure[章][問] = 1 なら「自信なし」の印。回答とは別に付け外しする（取り消しても残る）
 *   pos        回答画面で最後に開いていた問題 {c: 章, q: 問}（どちらも 0 始まり）
 * 実戦形式の1回分（mock）は、上に加えて:
 *   items      出題した問題 [[章, 問], …]（章の順・問題番号の順）。これがあれば実戦形式
 *   times      times[章][問] = その問題を表示していた時間（ミリ秒）
 *   elapsed    かかった時間の合計（ミリ秒）。回答画面を表示していたあいだだけ数える
 *   endedAt    終了して採点した時刻。それまでは途中（続きから解ける）
 *   ringNext   最初に回答したときに確定させる出題の記録（下の ring）。1問も答えずにやめた回は出題しなかったことにする
 * 実戦形式は別の場所（mhm2026-mock）に保存する。前の版のアプリが開いても、通常の記録に混ざらないように
 * テキスト問題集は mhm2026-b2-answers・mhm2026-b2-mock（手書きメモは回の ID ごとなので共通の mhm2026-ink-）
 */
const STORE = `${BOOK.store}-answers`;
const MOCK_STORE = `${BOOK.store}-mock`;
const ALL = CHAPTERS.flatMap((n, c) => Array.from({ length: n }, (_, q) => [c, q]));   // 全問を章・問題番号の順に
const isMock = s => !!s.items;
const orderOf = s => s.items || ALL;   // 回答画面で解く順番
const indexIn = (list, c, q) => list.findIndex(([a, b]) => a === c && b === q);

/* 実戦形式の出題の記録（章ごと・リングバッファ）
 *   used  今の周で出題した問題。章の問題を出し切ったら空にして次の周へ
 *   prev  前回の実戦形式で出題した問題。周が替わった直後でも、続けて同じ問題が出ないように避ける
 */
const mockStore = loadMockStore();
let ring = mockStore.ring;
const db = { sessions: [...load(), ...mockStore.mocks] };

function readStore(key) {
  let raw = null;
  try { raw = localStorage.getItem(key); } catch (e) { return null; }
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (e) {
    // 読めないデータは上書きで失わないよう、別名で残しておく
    try { localStorage.setItem(key + '.broken', raw); } catch (_) {}
    return null;
  }
}

function load() {
  const data = readStore(STORE);
  return (data && Array.isArray(data.sessions) ? data.sessions : []).map(normalize).filter(Boolean);
}

function loadMockStore() {
  const data = readStore(MOCK_STORE) || {};
  const r = data.ring || {};
  const fix = a => CHAPTERS.map((n, c) =>
    [...new Set((a && Array.isArray(a[c]) ? a[c] : []).filter(q => Number.isInteger(q) && q >= 0 && q < n))]);
  return {
    mocks: (Array.isArray(data.mocks) ? data.mocks : []).map(normalizeMock).filter(Boolean),
    ring: { used: fix(r.used), prev: fix(r.prev) },
  };
}

function normalizeMock(m) {
  const s = normalize(m);
  if (!s || !Array.isArray(m.items)) return null;
  const seen = new Set();
  s.items = m.items.filter(it => {
    const ok = Array.isArray(it) && Number.isInteger(it[0]) && it[0] >= 0 && it[0] < CHAPTERS.length
               && Number.isInteger(it[1]) && it[1] >= 0 && it[1] < CHAPTERS[it[0]] && !seen.has(`${it[0]}-${it[1]}`);
    if (ok) seen.add(`${it[0]}-${it[1]}`);
    return ok;
  }).map(([c, q]) => [c, q]);
  if (!s.items.length) return null;
  s.times = CHAPTERS.map((n, c) => Array.from({ length: n }, (_, q) => Math.max(0, Number(m.times && m.times[c] && m.times[c][q]) || 0)));
  s.elapsed = Math.max(0, Number(m.elapsed) || 0);
  s.endedAt = Number(m.endedAt) || null;
  if (indexIn(s.items, s.pos.c, s.pos.q) < 0) s.pos = { c: s.items[0][0], q: s.items[0][1] };
  return s;
}

function normalize(s) {
  if (!s || typeof s.id !== 'string') return null;
  return {
    id: s.id,
    createdAt: Number(s.createdAt) || Date.now(),
    startedAt: Number(s.startedAt) || null,
    updatedAt: Number(s.updatedAt) || null,
    answers: CHAPTERS.map((n, c) => Array.from({ length: n }, (_, q) => {
      const v = s.answers && s.answers[c] && s.answers[c][q];
      return v >= 1 && v <= 4 ? v : 0;
    })),
    unsure: CHAPTERS.map((n, c) => Array.from({ length: n }, (_, q) => (s.unsure && s.unsure[c] && s.unsure[c][q] ? 1 : 0))),
    pos: clampPos(s.pos),
  };
}

function clampPos(p) {
  const c = Math.min(Math.max(Number(p && p.c) || 0, 0), CHAPTERS.length - 1);
  const q = Math.min(Math.max(Number(p && p.q) || 0, 0), CHAPTERS[c] - 1);
  return { c, q };
}

let askedPersist = false;
function save() {
  const keep = db.sessions.filter(s => answered(s) > 0);   // 1問も答えていない回は残さない
  try {
    localStorage.setItem(STORE, JSON.stringify({ v: 1, sessions: keep.filter(s => !isMock(s)) }));
    localStorage.setItem(MOCK_STORE, JSON.stringify({ v: 1, mocks: keep.filter(isMock), ring }));
  } catch (e) {
    toast('保存できませんでした');
    return;
  }
  // ブラウザの容量整理で消されにくくしてもらう（対応ブラウザのみ）
  if (!askedPersist && keep.length && navigator.storage && navigator.storage.persist) {
    askedPersist = true;
    navigator.storage.persist().catch(() => {});
  }
}

/* ===== 集計 ===== */
const answeredIn = (s, c) => s.answers[c].reduce((n, v) => n + (v > 0), 0);
const answered = s => CHAPTERS.reduce((n, _, c) => n + answeredIn(s, c), 0);
const unsureIn = (s, c) => s.unsure[c].reduce((n, v) => n + v, 0);
const unsureCount = s => CHAPTERS.reduce((n, _, c) => n + unsureIn(s, c), 0);
const dateOf = s => s.startedAt || s.createdAt;
const findSession = id => db.sessions.find(s => s.id === id);
const blocksOf = c => Math.ceil(CHAPTERS[c] / BLOCK);
const blockRange = (c, b) => [b * BLOCK, Math.min((b + 1) * BLOCK, CHAPTERS[c])];
const rangeLabel = (from, to) => to - from > 1 ? `${from + 1}–${to}` : `${to}`;   // 1問だけのブロックは「41」

// 何回目の記録か（最初に回答した日の古い順）。通常の回と実戦形式は別に数える
function ordinal(s) {
  return db.sessions.filter(x => isMock(x) === isMock(s) && answered(x) > 0).sort((a, b) => dateOf(a) - dateOf(b)).indexOf(s) + 1;
}

/* ===== 実戦形式の出題 =====
 * 章ごとに MOCK_QUOTA の数だけ、今の周でまだ出していない問題からランダムに選ぶ（前回出した問題は避ける）。
 * 章の問題を出し切ったら次の周に入り、足りない分を次の周から選ぶ。
 * 189問 ÷ 50問なので、3回で150問を出し、4回目は残りの39問＋次の周の11問になる。
 * 選んだ問題は章の順・問題番号の順に並べる。戻り値の ring は、最初に回答したときに確定させる
 */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function drawMock(r) {
  const items = [], next = { used: [], prev: [] };
  CHAPTERS.forEach((n, c) => {
    const want = Math.min(MOCK_QUOTA[c], n), prev = new Set(r.prev[c]), picked = [];
    let used = new Set(r.used[c]);
    const take = cands => {
      for (const q of shuffle(cands)) {
        if (picked.length >= want) break;
        picked.push(q);
        used.add(q);
      }
    };
    const all = ALL.filter(([cc]) => cc === c).map(([, q]) => q);
    take(all.filter(q => !used.has(q) && !prev.has(q)));
    if (picked.length < want) {
      used = new Set();   // この章は出し切った → 次の周へ（ここまでに選んだ問題は前の周のぶん）
      take(all.filter(q => !prev.has(q) && !picked.includes(q)));
      if (picked.length < want) take(all.filter(q => !picked.includes(q)));   // 章の問題が少なくて、前回の問題を避けきれないとき
    }
    picked.sort((a, b) => a - b).forEach(q => items.push([c, q]));
    next.used[c] = [...used].sort((a, b) => a - b);
    next.prev[c] = picked;
  });
  return { items, ring: next };
}

const ringRest = () => TOTAL - ring.used.reduce((n, a) => n + a.length, 0);   // 今の周でまだ出していない問題の数

// ok: 正解 / ng: 不正解 / blank: 未回答 / nokey: 回答したが正解データなし
function status(s, c, q) {
  const v = s.answers[c][q], k = KEY[c] ? KEY[c][q] : 0;
  if (!v) return 'blank';
  if (!k) return 'nokey';
  return v === k ? 'ok' : 'ng';
}

// 絞り込み: all / ng / blank / unsure（自信なしの印）
const inFilter = (s, c, q, f) => f === 'all' || (f === 'unsure' ? !!s.unsure[c][q] : status(s, c, q) === f);

// 採点。実戦形式は出題した問題だけで数える（どちらも未回答は不正解の扱い）
function grade(s) {
  const ch = CHAPTERS.map((_, c) => ({ hasKey: !!KEY[c], keyed: 0, correct: 0, wrong: 0, blank: 0 }));
  for (const [c, q] of orderOf(s)) {
    if (!KEY[c] || !KEY[c][q]) continue;
    const r = ch[c], st = status(s, c, q);
    r.keyed++;
    if (st === 'ok') r.correct++; else if (st === 'ng') r.wrong++; else r.blank++;
  }
  const sum = k => ch.reduce((n, r) => n + r[k], 0);
  return { ch, keyed: sum('keyed'), correct: sum('correct'), wrong: sum('wrong'), blank: sum('blank') };
}

function fmtDate(ms) { const d = new Date(ms); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`; }
function fmtMD(ms) { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）`; }
function fmtTime(ms) { const d = new Date(ms); return `${d.getHours()}:${pad(d.getMinutes())}`; }
function fmtWhen(ms) {
  const d = new Date(ms);
  return d.toDateString() === new Date().toDateString() ? `今日 ${fmtTime(ms)}` : `${d.getMonth() + 1}/${d.getDate()} ${fmtTime(ms)}`;
}
// かかった時間: 12:34（1時間を超えたら 1:02:03）と、85分12秒
function fmtClock(ms) {
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60;
  return h ? `${h}:${pad(m)}:${pad(t % 60)}` : `${m}:${pad(t % 60)}`;
}
function fmtDur(ms) {
  const t = Math.round(ms / 1000), m = Math.floor(t / 60);
  return m ? `${m}分${pad(t % 60)}秒` : `${t}秒`;
}

/* ===== 画面の切り替え =====
 *   #/                 ホーム
 *   #/s/ID             どこから解くか選ぶ

 *   #key=…&ex=…        取り込み用リンク。開いたらすぐ #/key に置き換える
 * 回答画面の中で問題を移るときは履歴を積まない（戻るでその回の画面へ戻れるように）。
 * 実戦形式の回は、終了するまでは回答画面だけ、終了したら結果（grade）と解説だけを開く。
 */
let current = null;          // 開いている回
let gradeFilter = 'all';
let listFilter = 'all';
const ADVANCE_MS = 500;      // 回答してから次の問題へ進むまで
let advanceTimer = 0;        // 次の問題へ進むのを待っているあいだだけ 0 以外

function stopAdvance() { clearTimeout(advanceTimer); advanceTimer = 0; }
let exPos = { c: 0, q: 0 };  // 解説画面で開いている問題

function route() {
  const [kind, id, page, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (kind === 'key') return { view: 'key' };
  return kind === 's' && id ? { id, view: page || 'hub', arg } : { view: 'home' };
}

// 取り込み用リンクの問題集（b=2 ならテキスト問題集、付いていなければ過去問題集）
const linkBook = text => (/(?:^|[#&?\s])b=2(?!\d)/.test(text) ? 2 : 1);

function nav(hash) {
  history.replaceState({ ...(history.state || {}), y: window.scrollY }, '');
  history.pushState({ inApp: true }, '', hash);
  render();
  window.scrollTo(0, 0);
}

// アプリ内で進んできたなら履歴を戻る。直接開いたときは親の画面へ
function goBack(fallback) {
  if (history.state && history.state.inApp) history.back();
  else { history.replaceState(null, '', fallback); render(); }
}

window.addEventListener('popstate', e => {
  render();
  window.scrollTo(0, (e.state && e.state.y) || 0);
});

function render() {
  stopAdvance();
  clockOff();
  closeSheet();
  // 取り込み用リンクで開いたとき。正解をアドレス欄や履歴に残さないよう、先に URL から消す。
  // 別の問題集のリンクなら、その問題集に切り替えて読み込み直してから取り込む
  let linked = null;
  if (/^#(key|ex|b)=/.test(location.hash)) {
    if (linkBook(location.hash) !== BOOK_ID && switchBook(linkBook(location.hash), location.hash)) return;
    linked = location.hash.slice(1);
    history.replaceState(null, '', '#/key');
  }
  const r = route();
  document.documentElement.dataset.view = r.view;
  if (r.view === 'home') return renderHome();
  if (r.view === 'key') {
    current = null;
    renderKey();
    if (linked) { $('#keyText').value = linked; actions.readKey(); }
    return;
  }
  const s = findSession(r.id);
  if (!s) {
    history.replaceState(null, '', '#/');
    document.documentElement.dataset.view = 'home';
    return renderHome();
  }
  if (current !== s) gradeFilter = listFilter = 'all';
  current = s;
  if (isMock(s)) {
    const v = !s.endedAt ? 'q' : r.view === 'ex' ? 'ex' : 'grade';
    if (v !== r.view) history.replaceState(history.state, '', `#/s/${s.id}/${v}`);
    document.documentElement.dataset.view = v;
    if (v === 'q') renderAnswer();
    else if (v === 'ex') renderEx(r.arg);
    else renderGrade(s);
    return;
  }
  if (r.view === 'q') renderAnswer(s);
  else if (r.view === 'list') renderList(s);
  else if (r.view === 'grade') renderGrade(s);
  else if (r.view === 'ex') renderEx(r.arg);
  else renderHub(s);
}

function blockButton(s, c, b) {

  return `<button class="blk${k === size ? ' full' : ''}${here ? ' here' : ''}" data-act="block" data-c="${c}" data-b="${b}"
            aria-label="第${c + 1}章 問${rangeLabel(from, to)}（${k}問回答済み）">
    <span class="blk-range num">${rangeLabel(from, to)}</span>
    <span class="blk-bar"><i style="width:${k / size * 100}%"></i></span>
    <span class="blk-count num">${k === size ? '✓ ' : ''}${k}/${size}</span>
  </button>`;
}

/* ===== 問題文と手書きメモ =====
 * 問題文は解説と同じ explain.bin に入っている（items['章-問'].question）。
 * 紙面は幅 PAPER_W で組み、表示する場所の幅に合わせて拡大・縮小する。
 * 手書きメモは紙面の座標で、回ごと・問題ごとに localStorage（mhm2026-ink-回のID）へ保存する。
 */
const PAPER_W = 344;   // 紙面の幅（CSS の .paper と同じ）
const TEXT_EM = 21;    // 紙面の本文の幅（全角の文字数）。組合せの選択肢を表にできるかの判断に使う
const CHOICE_N = { '①': 1, '②': 2, '③': 3, '④': 4 };

const questionOf = (c, q) => (EX && EX.items[`${c + 1}-${q + 1}`] || {}).question || null;
const hasQuestions = () => !!(EX && Object.values(EX.items).some(it => it.question));

// __語句__ は下線、［ア］は空欄の枠
const qrich = s => esc(s).replace(/__(.+?)__/g, '<u>$1</u>')
  .replace(/［\s*([^\s］]*)\s*］/g, (_, k) => `<span class="qblank">${k || '　'}</span>`);
// 文字列の幅の目安（全角 1 文字 = 1）
const emw = s => [...String(s)].reduce((n, ch) => n + (/[\x20-\x7e]/.test(ch) ? .55 : 1), 0);

function paperHTML(c, q) {
  const Q = questionOf(c, q);
  if (!Q) return `<div class="pp-head"><b>第${q + 1}問</b></div><p class="pp-none">この問題の問題文はありません</p>`;
  const meta = [Q.kai, Q.ref && `公式テキスト ${Q.ref}`, Q.sec].filter(Boolean).map(esc).join('<br>');   // sec: テキスト問題集の節・問題番号
  return `
    <div class="pp-head"><b>第${q + 1}問</b>${meta ? `<span>${meta}</span>` : ''}</div>
    <p class="pp-stem">${qrich(Q.stem)}</p>
    ${Q.body && Q.body.length ? `<div class="pp-body">${Q.body.map(bodyBlock).join('')}</div>` : ''}
    <div class="pp-choices">${choicesHTML(Q.choices || [])}</div>`;
}

function bodyBlock(b) {
  if (b.type === 'stmt') return `<div class="pp-item"><span class="pp-mark">${esc(b.mark)}</span><div>${qrich(b.text)}</div></div>`;
  if (b.type === 'table') {
    const head = b.head ? `<thead><tr>${b.head.map(x => `<th>${qrich(x)}</th>`).join('')}</tr></thead>` : '';
    const rows = (b.rows || []).map(r => `<tr>${r.map(x => `<td>${qrich(x)}</td>`).join('')}</tr>`).join('');
    return `<table class="pp-table">${b.title ? `<caption>${qrich(b.title)}</caption>` : ''}${head}<tbody>${rows}</tbody></table>`;
  }
  // 図は書き起こしのときに SVG で作り直したもの（explain.bin の中身なので、そのまま埋め込む）
  if (b.type === 'figure') return `<div class="pp-figure">${b.svg || ''}</div>`;
  return `<p class="pp-para">${qrich(b.text)}</p>`;
}

// 組合せの選択肢（cells）は、紙面の幅に収まれば見出しつきの表に、収まらなければ語句を縦に並べる
function choicesHTML(choices) {
  const lab = k => /^[A-Za-z]$/.test(k) ? esc(k) : `<span class="qblank">${esc(k)}</span>`;
  const labels = choices.length && choices.every(ch => ch.cells) ? choices[0].cells.map(x => x[0]) : null;
  const aligned = labels && choices.every(ch => ch.cells.length === labels.length && ch.cells.every((x, i) => x[0] === labels[i]));
  if (aligned) {
    const width = 2.2 + labels.reduce((n, k, i) => n + 1.2 + Math.max(emw(k) + .6, ...choices.map(ch => emw(ch.cells[i][1]))), 0);
    if (width <= TEXT_EM) {
      return `<table class="pp-grid">
        <thead><tr><th></th>${labels.map(k => `<th>${lab(k)}</th>`).join('')}</tr></thead>
        <tbody>${choices.map(ch => `<tr data-n="${CHOICE_N[ch.mark] || ''}"><th>${esc(ch.mark)}</th>${
          ch.cells.map(x => `<td${x[1] === '×' ? ' class="pp-x"' : ''}>${qrich(x[1])}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
    }
  }
  return choices.map(ch => `<div class="pp-item" data-n="${CHOICE_N[ch.mark] || ''}"><span class="pp-mark">${esc(ch.mark)}</span>${
    ch.cells ? `<div class="pp-cells">${ch.cells.map(x => `<div><span class="pp-lab">${lab(x[0])}</span>${qrich(x[1])}</div>`).join('')}</div>`
             : `<div>${qrich(ch.text)}</div>`}</div>`).join('');
}

// host の幅に合わせて紙面を拡大・縮小する。表示する紙面は1つだけなので、監視も1つ
let paperRO = null;
function mountPaper(host, c, q, max = 1.4) {
  if (paperRO) paperRO.disconnect();
  host.innerHTML = `<div class="qsizer"><div class="paper">${paperHTML(c, q)}<svg class="ink" aria-hidden="true"></svg></div></div>`;
  const sizer = host.firstElementChild, paper = sizer.firstElementChild;
  const fit = () => {
    const w = host.clientWidth;
    if (!w) return;
    // 横向きなど背の低い表示枠では、拡大しすぎると数行しか見えないので控えめに（余った幅は左右の余白に）
    const short = host.classList.contains('qscroll') && host.clientHeight < 480;
    const s = Math.min(Math.max(w / PAPER_W, .75), short ? 1.1 : max);
    paper.style.transform = `scale(${s})`;
    sizer.style.width = `${PAPER_W * s}px`;
    sizer.style.height = `${paper.offsetHeight * s}px`;
  };
  fit();
  if (window.ResizeObserver) {
    paperRO = new ResizeObserver(fit);
    paperRO.observe(host);
    paperRO.observe(paper);
  }
  return paper;
}

const INK_STORE = 'mhm2026-ink-';
let inkBook = { id: null, data: {} };   // 開いている回のメモ { '章-問': [線, …] }
let inkTool = '';                       // '' | 'pen' | 'eraser'。問題を移ったら閉じる（次の問題はまずスクロールして読めるように）
let inkHinted = false;
// 表示中の紙面のメモ。history は「操作する前の strokes」を積んだもの（1つ戻す用）
const ink = { paper: null, svg: null, sid: null, key: null, strokes: [], history: [] };

function inkData(id) {
  if (inkBook.id !== id) {
    let data = {};
    try { data = JSON.parse(localStorage.getItem(INK_STORE + id)) || {}; } catch (e) { /* 読めなければ空 */ }
    inkBook = { id, data };
  }
  return inkBook.data;
}

// 線は [x0, y0, x1, y1, …]（紙面の座標）。保存は 0.5px 単位の差分を「,」でつないだ文字列
function encodeStroke(p) {
  const out = [];
  let px = 0, py = 0;
  for (let i = 0; i < p.length; i += 2) {
    const x = Math.round(p[i] * 2), y = Math.round(p[i + 1] * 2);
    out.push(x - px, y - py);
    px = x; py = y;
  }
  return out.join(',');
}
function decodeStroke(str) {
  const v = String(str).split(',').map(Number), p = [];
  let x = 0, y = 0;
  for (let i = 0; i + 1 < v.length; i += 2) { x += v[i]; y += v[i + 1]; p.push(x / 2, y / 2); }
  return p.every(Number.isFinite) ? p : [];
}

// なめらかに見えるよう、点と点の中点を通る2次曲線でつなぐ
function strokePath(p) {
  const f = v => Math.round(v * 10) / 10;
  if (p.length <= 2) return `M${f(p[0])} ${f(p[1])}h.01`;
  let d = `M${f(p[0])} ${f(p[1])}`;
  for (let i = 2; i < p.length - 2; i += 2) d += `Q${f(p[i])} ${f(p[i + 1])} ${f((p[i] + p[i + 2]) / 2)} ${f((p[i + 1] + p[i + 3]) / 2)}`;
  return `${d}L${f(p[p.length - 2])} ${f(p[p.length - 1])}`;
}

// 線を間引く（Ramer–Douglas–Peucker）。○ のように始点と終点が重なる線も崩さない
function simplify(p, eps = .5) {
  const n = p.length / 2;
  if (n <= 2) return p;
  const keep = new Uint8Array(n);
  keep[0] = keep[n - 1] = 1;
  const stack = [[0, n - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    const ax = p[a * 2], ay = p[a * 2 + 1], dx = p[b * 2] - ax, dy = p[b * 2 + 1] - ay, len = Math.hypot(dx, dy);
    let far = -1, dmax = eps;
    for (let i = a + 1; i < b; i++) {
      const x = p[i * 2] - ax, y = p[i * 2 + 1] - ay;
      const d = len < 1 ? Math.hypot(x, y) : Math.abs(dy * x - dx * y) / len;
      if (d > dmax) { dmax = d; far = i; }
    }
    if (far >= 0) { keep[far] = 1; stack.push([a, far], [far, b]); }
  }
  const out = [];
  for (let i = 0; i < n; i++) if (keep[i]) out.push(p[i * 2], p[i * 2 + 1]);
  return out;
}

function nearStroke(p, x, y, r) {
  for (let i = 0; i < p.length; i += 2) {
    const ax = p[i], ay = p[i + 1], bx = i + 2 < p.length ? p[i + 2] : ax, by = i + 2 < p.length ? p[i + 3] : ay;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)) : 0;
    if (Math.hypot(ax + t * dx - x, ay + t * dy - y) <= r) return true;
  }
  return false;
}

function attachInk(paper, s, c, q, editable) {
  ink.paper = paper;
  ink.svg = paper.querySelector('.ink');
  ink.sid = s.id;
  ink.key = `${c + 1}-${q + 1}`;
  ink.strokes = (inkData(s.id)[ink.key] || []).map(decodeStroke).filter(p => p.length >= 2);
  ink.history = [];
  drawInk();
  if (editable) bindInk(ink.svg);
}

function drawInk() {
  ink.svg.innerHTML = ink.strokes.map(p => `<path d="${strokePath(p)}"/>`).join('');
}

function saveInk() {
  const data = inkData(ink.sid);
  if (ink.strokes.length) data[ink.key] = ink.strokes.map(encodeStroke);
  else delete data[ink.key];
  try {
    if (Object.keys(data).length) localStorage.setItem(INK_STORE + ink.sid, JSON.stringify(data));
    else localStorage.removeItem(INK_STORE + ink.sid);
  } catch (e) {
    toast('メモを保存できませんでした');
  }
  paintInkBar();
}

function deleteInk(id) {
  try { localStorage.removeItem(INK_STORE + id); } catch (e) { /* 無視 */ }
  if (inkBook.id === id) inkBook = { id: null, data: {} };
}

// ペン・消しゴムのとき: 最初に触れた指で書く（消す）。2本目以降の指は無視する。
// このあいだ問題文はスクロールしない（CSS の .inking で止め、iPhone 向けにタッチの既定動作も止める）
function bindInk(svgEl) {
  let mode = '', id = null, cur = null, path = null, before = null;
  const toPaper = e => {
    const r = ink.paper.getBoundingClientRect(), s = r.width / PAPER_W;
    return [(e.clientX - r.left) / s, (e.clientY - r.top) / s];
  };
  const erase = ([x, y]) => {
    const n = ink.strokes.length;
    ink.strokes = ink.strokes.filter(p => !nearStroke(p, x, y, 10));
    if (ink.strokes.length !== n) drawInk();
  };
  const finish = () => {
    if (mode === 'draw') {
      const p = simplify(cur);
      ink.history.push(ink.strokes.slice());
      ink.strokes.push(p);
      path.setAttribute('d', strokePath(p));
      saveInk();
    } else if (mode === 'erase' && ink.strokes.length !== before.length) {
      ink.history.push(before);
      saveInk();
    }
    mode = ''; id = cur = path = before = null;
  };

  const block = e => { if (inkTool && e.cancelable) e.preventDefault(); };
  svgEl.addEventListener('touchstart', block, { passive: false });
  svgEl.addEventListener('touchmove', block, { passive: false });
  svgEl.addEventListener('pointerdown', e => {
    if (!inkTool) return;
    e.preventDefault();
    if (id !== null) return;   // 書いている途中に触れたほかの指（手のひらなど）
    try { svgEl.setPointerCapture(e.pointerId); } catch (_) { /* 無視 */ }
    id = e.pointerId;
    if (inkTool === 'pen') {
      mode = 'draw';
      cur = toPaper(e);
      path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', strokePath(cur));
      svgEl.appendChild(path);
    } else {
      mode = 'erase';
      before = ink.strokes.slice();
      erase(toPaper(e));
    }
  });
  svgEl.addEventListener('pointermove', e => {
    if (e.pointerId !== id || !mode) return;
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    for (const ev of evs.length ? evs : [e]) {
      const pt = toPaper(ev);
      if (mode === 'erase') erase(pt);
      else if (Math.hypot(pt[0] - cur[cur.length - 2], pt[1] - cur[cur.length - 1]) >= .8) cur.push(pt[0], pt[1]);
    }
    if (mode === 'draw') path.setAttribute('d', strokePath(cur));
  });
  const up = e => { if (e.pointerId === id) finish(); };
  svgEl.addEventListener('pointerup', up);
  svgEl.addEventListener('pointercancel', up);
}

function inkBarHTML() {
  return `<div class="inkbar">
    <button class="more" data-act="inkClear" aria-label="この問題のメモを消す">${ICON.trash}</button>
    <button class="more" data-act="inkUndo" aria-label="1つ戻す">${ICON.undo}</button>
    <button class="more" data-act="inkTool" data-tool="eraser" aria-label="消しゴム">${ICON.eraser}</button>
    <button data-act="inkTool" data-tool="pen" aria-label="ペンで書く">${ICON.pen}<i class="ink-dot" hidden></i></button>
  </div>`;
}

function paintInkBar() {
  const area = $('#qArea');
  if (!area) return;
  area.classList.toggle('inking', !!inkTool);
  area.querySelectorAll('[data-tool]').forEach(b => {
    const on = b.dataset.tool === inkTool;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  area.querySelector('[data-act="inkUndo"]').disabled = !ink.history.length;
  area.querySelector('[data-act="inkClear"]').disabled = !ink.strokes.length;
  area.querySelector('.ink-dot').hidden = !ink.strokes.length;   // ペンを閉じていてもメモがあると分かるように
}

/* ===== 回答 ===== */
// 問題文が取り込まれていれば問題文（紙面）を、なければ大きな問題番号を出す。
// 実戦形式は、右上が「終了」で、経過時間を出す
function renderAnswer() {
  const paper = hasQuestions(), mock = isMock(current);
  view.innerHTML = `
    <div class="ans${paper ? ' has-paper' : ''}">
      ${bar('<span id="aTitle"></span>', `${mock ? '<span id="aClock"></span> · ' : ''}<span id="aSub"></span>`,
            mock ? '<button class="bar-end" data-act="askEndMock">終了</button>'
                 : `<button class="icon-btn" data-act="toList" aria-label="回答一覧">${ICON.list}</button>`)}
      ${paper ? `<section class="qarea" id="qArea"><div class="qscroll" id="qScroll"></div>${inkBarHTML()}</section>` : `
      <section class="qhead">
        <div class="qnum" id="aNum"></div>
        <div class="qmeta num" id="aMeta"></div>
      </section>`}
      <div class="strip" id="aStrip"></div>
      <div class="choices">
        ${[1, 2, 3, 4].map(v => `<button class="choice" data-act="choose" data-v="${v}" aria-label="${v} を選ぶ">${v}</button>`).join('')}
      </div>
      <nav class="qnav">
        <button class="nav-btn" data-act="prev" id="aPrev">${ICON.back}前へ</button>
        <button class="nav-btn ghost" data-act="clear" id="aClear">取り消し</button>
        <button class="nav-btn unsure" data-act="unsure" id="aUnsure">${UB}自信なし</button>
        <button class="nav-btn" data-act="next">次へ${ICON.next}</button>
      </nav>
    </div>`;
  paintAnswer(true);
  clockOn();
}

function paintAnswer(moved) {
  const s = current, { c, q } = s.pos, v = s.answers[c][q];
  const mock = isMock(s), list = orderOf(s), idx = indexIn(list, c, q), host = $('#qScroll');
  // 10マス: 通常の回は章の中の10問ずつ、実戦形式は出題した順に10問ずつ
  let from, to, cellAt;
  if (mock) {
    from = idx - idx % BLOCK;
    to = Math.min(from + BLOCK, list.length);
    cellAt = i => list[i];
    $('#aTitle').textContent = `実戦形式　問${idx + 1} / ${list.length}`;
    $('#aSub').textContent = `第${c + 1}章 第${q + 1}問`;
    paintClock();
  } else {
    [from, to] = blockRange(c, Math.floor(q / BLOCK));
    cellAt = i => [c, i];
    $('#aTitle').textContent = `第${c + 1}章　${rangeLabel(from, to)}`;
    $('#aSub').textContent = (s.startedAt ? `${fmtMD(dateOf(s))}の記録` : '新しい記録') + (host ? ` · ${answered(s)} / ${TOTAL} 問` : '');
  }
  if (host) {
    if (moved || !ink.paper || !host.contains(ink.paper)) {
      inkTool = '';
      attachInk(mountPaper(host, c, q), s, c, q, true);
      host.scrollTop = 0;
    }
    ink.paper.querySelectorAll('[data-n]').forEach(el => el.classList.toggle('picked', Number(el.dataset.n) === v));
    paintInkBar();
  } else {
    const num = $('#aNum');
    num.innerHTML = mock ? `<span class="q-label">問</span>${idx + 1}<span class="q-of">/ ${list.length}</span>`
                         : `<span class="q-label">問</span>${q + 1}<span class="q-of">/ ${CHAPTERS[c]}</span>`;
    if (moved) { num.classList.remove('enter'); void num.offsetWidth; num.classList.add('enter'); }
    $('#aMeta').textContent = mock ? `第${c + 1}章 第${q + 1}問 · ${answered(s)} / ${list.length} 問 回答済み`
                                   : `全体 ${answered(s)} / ${TOTAL} 問 回答済み`;
  }
  let cells = '';
  for (let i = from; i < to; i++) {
    const [cc, qq] = cellAt(i), a = s.answers[cc][qq], u = s.unsure[cc][qq];
    cells += `<button class="cell${cc === c && qq === q ? ' cur' : ''}" data-act="jump" data-c="${cc}" data-q="${qq}" aria-label="問${i + 1}${a ? ` 回答${a}` : ' 未回答'}${u ? ' 自信なし' : ''}"><small>${i + 1}</small><b>${a || ''}${u ? UB : ''}</b></button>`;
  }
  $('#aStrip').innerHTML = cells;
  document.querySelectorAll('.choice').forEach(b => {
    const on = Number(b.dataset.v) === v;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  const unsure = $('#aUnsure'), u = !!s.unsure[c][q];
  unsure.classList.toggle('on', u);
  unsure.setAttribute('aria-pressed', u);
  $('#aPrev').disabled = idx === 0;
  $('#aClear').disabled = !v;
}

function choose(v) {
  const s = current, { c, q } = s.pos;
  s.answers[c][q] = v;
  s.updatedAt = Date.now();
  if (!s.startedAt) s.startedAt = s.updatedAt;   // 最初に回答した日を、この回の日付にする
  if (s.ringNext) { ring = s.ringNext; delete s.ringNext; }   // 実戦形式: 最初に回答したら、出題したことを確定する
  save();
  if (navigator.vibrate) navigator.vibrate(8);
  paintAnswer(false);
  // 選んだ番号が光るのを見せてから次の問題へ
  stopAdvance();
  advanceTimer = setTimeout(goNext, ADVANCE_MS);
}

// 自信なしの印を付け外しする。それだけでは次の問題へ進まない（先に押しておけば、回答したときにいつも通り進む）。
// 回答して次へ進むのを待っているあいだに押したときは、印が付いたのを見せてから進む
function toggleUnsure() {
  const s = current, { c, q } = s.pos;
  s.unsure[c][q] = s.unsure[c][q] ? 0 : 1;
  s.updatedAt = Date.now();
  save();
  if (navigator.vibrate) navigator.vibrate(8);
  paintAnswer(false);
  if (advanceTimer) {
    stopAdvance();
    advanceTimer = setTimeout(goNext, ADVANCE_MS);
  }
}

function clearAnswer() {
  const s = current, { c, q } = s.pos;
  if (!s.answers[c][q]) return;
  stopAdvance();
  s.answers[c][q] = 0;
  s.updatedAt = Date.now();
  if (!answered(s)) s.startedAt = null;
  save();
  paintAnswer(false);
}

function setPos(c, q) {
  stopAdvance();
  current.pos = { c, q };
  clockLap();   // 実戦形式: ここまでの時間は、前に表示していた問題のぶん
  save();
  paintAnswer(true);
}

// 解く順番（orderOf）で次へ・前へ。章が替わったら知らせる
function goNext() {
  const { c, q } = current.pos, list = orderOf(current), next = list[indexIn(list, c, q) + 1];
  if (!next) { stopAdvance(); showDone(); return; }
  setPos(next[0], next[1]);
  if (next[0] !== c) toast(`第${next[0] + 1}章に入りました`);
}

function goPrev() {
  const { c, q } = current.pos, list = orderOf(current), prev = list[indexIn(list, c, q) - 1];
  if (prev) setPos(prev[0], prev[1]);
}

function firstBlank(s) {
  const p = orderOf(s).find(([c, q]) => !s.answers[c][q]);
  return p ? { c: p[0], q: p[1] } : null;
}

function showDone() {
  if (isMock(current)) return showMockDone();
  const n = answered(current), rest = TOTAL - n;
  openSheet(`
    <h2>${rest ? '最後の問題まで来ました' : `全${TOTAL}問 回答しました`}</h2>
    <p>${rest ? `${TOTAL}問中 ${n}問に回答済み、未回答が ${rest}問あります。`
              : HAS_KEY ? '○付けで結果を確認できます。' : '正解データが登録されると○付けできます。'}</p>
    <div class="btns">
      ${rest ? '<button class="primary" data-act="toFirstBlank">未回答の問題へ</button>' : ''}
      <button class="${rest ? '' : 'primary'}" data-act="toGrade">○付けを見る</button>
      <button data-act="closeSheet">閉じる</button>
    </div>`);
}

/* ===== 実戦形式 =====
 * 時間は回答画面を表示しているあいだだけ数え、表示していた問題の時間（times）と合計（elapsed）に足す。
 * ほかの画面へ移ったとき（render）・アプリを裏に回したとき（visibilitychange）に止めて保存する。
 * 左上の ‹ で抜けると中断（あとで続きから）、右上の「終了」で採点して結果へ
 */
const clock = { s: null, c: 0, q: 0, since: 0, timer: 0 };
const elapsedOf = s => s.elapsed + (clock.s === s ? Math.max(0, Date.now() - clock.since) : 0);

function clockOn() {
  const s = current;
  if (clock.s || !s || !isMock(s) || s.endedAt || route().view !== 'q' || document.hidden) return;
  Object.assign(clock, { s, c: s.pos.c, q: s.pos.q, since: Date.now() });
  clock.timer = setInterval(paintClock, 1000);
  paintClock();
}

// ここまでの時間を表示していた問題に足して、今の問題で数え直す
function clockLap() {
  const s = clock.s;
  if (!s) return;
  const now = Date.now(), d = Math.max(0, now - clock.since);
  s.times[clock.c][clock.q] += d;
  s.elapsed += d;
  Object.assign(clock, { c: s.pos.c, q: s.pos.q, since: now });
}

function clockOff() {
  if (!clock.s) return;
  clockLap();
  clearInterval(clock.timer);
  clock.s = null;
  save();
}

function paintClock() {
  const el = $('#aClock');
  if (el && current && isMock(current)) el.textContent = `経過 ${fmtClock(elapsedOf(current))}`;
}

document.addEventListener('visibilitychange', () => { if (document.hidden) clockOff(); else clockOn(); });
window.addEventListener('pagehide', clockOff);

function showMockDone() {
  const s = current, N = s.items.length, n = answered(s), rest = N - n;
  openSheet(`
    <h2>${rest ? '最後の問題まで来ました' : `${N}問すべて回答しました`}</h2>
    <p>${rest ? `${N}問中 ${n}問に回答済み、未回答が ${rest}問あります。` : '見直しが済んだら、終了して採点します。'}経過 ${fmtClock(elapsedOf(s))}</p>
    <div class="btns">
      ${rest ? '<button class="primary" data-act="toFirstBlank">未回答の問題へ</button>' : ''}
      <button class="${rest ? '' : 'primary'}" data-act="endMock">終了して採点する</button>
      <button data-act="closeSheet">${rest ? '閉じる' : '見直す'}</button>
    </div>`);
}

/* ===== 回答一覧 ===== */
// 「自信なし」で絞り込むと、印の付いた問題だけを章ごとに詰めて並べる
function renderList(s) {
  const un = unsureCount(s), f = listFilter;
  const chips = [['all', 'すべて'], ['unsure', `自信なし ${un}`]];
  const body = CHAPTERS.map((len, c) => {
    if (f === 'unsure') {
      let cells = '';
      for (let q = 0; q < len; q++) if (s.unsure[c][q]) cells += listCell(s, c, q);
      return cells ? `<section class="card ch">
        <div class="ch-head"><b>第${c + 1}章</b><span class="num">自信なし ${unsureIn(s, c)}</span></div>
        <div class="lgrid">${cells}</div>
      </section>` : '';
    }
    return `<section class="card ch">
      <div class="ch-head"><b>第${c + 1}章</b><span class="num">${answeredIn(s, c)} / ${len}</span></div>
      ${Array.from({ length: blocksOf(c) }, (_, b) => {
        const [from, to] = blockRange(c, b);
        let cells = '';
        for (let q = from; q < to; q++) cells += listCell(s, c, q);
        return `<div class="lgrid">${cells}</div>`;
      }).join('')}
    </section>`;
  }).join('');
  view.innerHTML = `
    ${bar('回答一覧', `${fmtDate(dateOf(s))} · ${answered(s)} / ${TOTAL} 問`)}
    <div class="chips">
      ${chips.map(([k, label]) => `<button class="chip num${f === k ? ' on' : ''}" data-act="filterList" data-f="${k}">${label}</button>`).join('')}
    </div>
    <p class="hint">番号をタップすると、その問題を開いて答えを直せます。${un ? `${UB}は「自信なし」の印です。` : ''}</p>
    ${body || '<div class="empty">「自信なし」の印を付けた問題はありません。<br>回答画面の「自信なし」で印を付けられます。</div>'}`;
}

function listCell(s, c, q) {
  const v = s.answers[c][q];
  return `<button class="acell${v ? '' : ' blank'}" data-act="edit" data-c="${c}" data-q="${q}"><small>${q + 1}</small><b>${v || '－'}</b>${s.unsure[c][q] ? UB : ''}</button>`;
}

/* ===== ○付け（実戦形式の結果も） ===== */
const paceOf = s => MOCK_MIN * 60000 / s.items.length;   // 実戦形式の1問あたりの時間の目安

function renderGrade(s) {
  const mock = isMock(s), list = orderOf(s);
  const g = grade(s), blankAll = list.length - answered(s), f = gradeFilter;
  const pct = g.keyed ? Math.round(g.correct / g.keyed * 100) : 0;
  let un = 0, unOk = 0;   // 自信なしの印を付けた問題と、そのうちの正解
  for (const [c, q] of list) if (s.unsure[c][q]) { un++; unOk += status(s, c, q) === 'ok'; }
  const chips = [['all', 'すべて'], ...(HAS_KEY ? [['ng', `× だけ ${g.wrong}`]] : []), ['unsure', `自信なし ${un}`], ['blank', `未回答 ${blankAll}`]];
  const body = CHAPTERS.map((_, c) => gradeChapter(s, c, g.ch[c], f)).join('');
  const n = answered(s);
  view.innerHTML = `
    ${bar(mock ? '実戦形式の結果' : '○付け', `${fmtDate(dateOf(s))} · ${mock ? '実戦 ' : ''}${ordinal(s)}回目`)}
    ${HAS_KEY ? `
      <section class="card score">
        <div class="ring" style="--p:${pct}"><span class="num"><b>${pct}<small>%</small></b></span></div>
        <div>
          <div class="score-main num">正解 <b>${g.correct}</b> / ${g.keyed}</div>
          <div class="score-sub num">× ${g.wrong}　未回答 ${g.blank}</div>
          ${un ? `<div class="score-sub num">自信なし ${un}問（うち正解 ${unOk}）</div>` : ''}
          ${g.keyed < list.length ? `<div class="score-sub num">正解データのある ${g.keyed}問で採点</div>` : ''}
        </div>
      </section>` : `
      <section class="card notice">
        <b>正解データがまだ登録されていません</b>
        <p>取り込むと、ここで自動的に○付けします。いまは自分の回答だけを表示しています。</p>
        <button class="secondary" data-act="toKey">正解データを取り込む</button>
      </section>`}
    ${mock ? `
      <section class="card mtime">
        <div><small>かかった時間</small><b class="num">${fmtDur(s.elapsed)}</b><span>目安 ${MOCK_MIN}分</span></div>
        <div><small>1問あたり</small><b class="num">${n ? fmtDur(s.elapsed / n) : '－'}</b><span>目安 ${fmtDur(paceOf(s))}</span></div>
      </section>` : ''}
    ${HAS_KEY ? `
      <section class="card chs">
        ${g.ch.map(chapterRow).join('')}
        <div class="chs-note">縦線は合格の目安 ${PASS}%</div>
      </section>` : ''}
    <div class="chips">
      ${chips.map(([k, label]) => `<button class="chip num${f === k ? ' on' : ''}" data-act="filter" data-f="${k}">${label}</button>`).join('')}
    </div>
    <p class="hint">問題をタップすると解説を開きます。${f === 'all' ? '' : '解説の「次の問題」も、この絞り込みの中で進みます。'}${un ? `${UB}は「自信なし」の印です。` : ''}${
      mock ? `いちばん下は、その問題にかけた時間（目安の ${fmtDur(paceOf(s))} を超えたものは黄色）。` : ''}</p>
    ${body || '<div class="empty">該当する問題はありません。</div>'}`;
}

function chapterRow(r, c) {
  if (!r.hasKey) return `<div class="crow"><span>第${c + 1}章</span><span class="cbar"></span><span class="cval off">未登録</span></div>`;
  const p = r.keyed ? r.correct / r.keyed * 100 : 0;
  return `<div class="crow">
    <span>第${c + 1}章</span>
    <span class="cbar"><i class="${p >= PASS ? 'pass' : ''}" style="width:${p}%"></i><em></em></span>
    <span class="cval num">${r.correct}/${r.keyed}<small>${Math.round(p)}%</small></span>
  </div>`;
}

function gradeCell(s, c, q) {
  const st = status(s, c, q), v = s.answers[c][q], k = KEY[c] ? KEY[c][q] : 0;
  const mark = { ok: '○', ng: '×', blank: '－', nokey: String(v) }[st];
  // × の下は「自分の答え→正解」
  const sub = st === 'ok' ? String(v) : st === 'ng' ? `${v}→${k}` : st === 'blank' && k ? `正解${k}` : '';
  // 実戦形式は、その問題にかけた時間も（開かなかった問題は出さない）
  const t = isMock(s) ? s.times[c][q] : 0, time = t ? `<span class="t${t > paceOf(s) ? ' slow' : ''}">${fmtClock(t)}</span>` : '';
  return `<button class="acell ${st}" data-act="openEx" data-c="${c}" data-q="${q}"><small>${q + 1}</small><b>${mark}</b>${sub ? `<span class="sub">${sub}</span>` : ''}${time}${s.unsure[c][q] ? UB : ''}</button>`;
}

// 章ごとのカード。通常の回の「すべて」は10問ずつ並べ、絞り込みと実戦形式は当てはまる問題だけを詰めて並べる
function gradeChapter(s, c, r, f) {
  const head = `<div class="ch-head"><b>第${c + 1}章</b><span class="num">${r.hasKey ? `正解 ${r.correct} / ${r.keyed}` : '正解未登録'}</span></div>`;
  if (f === 'all' && !isMock(s)) {
    const grids = Array.from({ length: blocksOf(c) }, (_, b) => {
      const [from, to] = blockRange(c, b);
      let cells = '';
      for (let q = from; q < to; q++) cells += gradeCell(s, c, q);
      return `<div class="lgrid">${cells}</div>`;
    }).join('');
    return `<section class="card ch">${head}${grids}</section>`;
  }
  let cells = '';
  for (const [cc, q] of orderOf(s)) if (cc === c && inFilter(s, c, q, f)) cells += gradeCell(s, c, q);
  return cells ? `<section class="card ch">${head}<div class="lgrid">${cells}</div></section>` : '';
}

/* ===== 解説 ===== */
const CIRCLED = { '①': 1, '②': 2, '③': 3, '④': 4 };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const rich = s => esc(s).replace(/__(.+?)__/g, '<u>$1</u>');   // __語句__ は下線

// 解説の「前の問題／次の問題」で進む順番。○付け画面の絞り込みに合わせる（実戦形式は出題した問題の中で）
const exList = s => orderOf(s).filter(([c, q]) => inFilter(s, c, q, gradeFilter));

function renderEx(arg) {
  const m = /^(\d+)-(\d+)$/.exec(arg || ''), list = orderOf(current);
  const c = m ? Number(m[1]) - 1 : -1, q = m ? Number(m[2]) - 1 : -1;
  exPos = indexIn(list, c, q) >= 0 ? { c, q } : { c: list[0][0], q: list[0][1] };
  view.innerHTML = '<div id="exView"></div>';
  paintEx();
}

function paintEx() {
  const s = current, { c, q } = exPos;
  const v = s.answers[c][q], k = KEY[c] ? KEY[c][q] : 0, st = status(s, c, q);
  const e = EX && EX.items[`${c + 1}-${q + 1}`];
  const list = exList(s), i = list.findIndex(([a, b]) => a === c && b === q);
  const where = gradeFilter !== 'all' && i >= 0 ? ` · ${{ ng: '× だけ', blank: '未回答', unsure: '自信なし' }[gradeFilter]} ${i + 1}/${list.length}` : '';
  $('#exView').innerHTML = `
    ${bar(`第${c + 1}章　第${q + 1}問`, `${isMock(s) ? `実戦 ${ordinal(s)}回目 · 時間 ${fmtClock(s.times[c][q])}` : `${fmtMD(dateOf(s))}の記録`}${where}`)}
    <section class="card exhead">
      <div><small>あなたの答え${s.unsure[c][q] ? '（自信なし）' : ''}</small><b class="num">${v || '－'}</b></div>
      <div><small>正解</small><b class="num">${k || '－'}</b></div>
      <span class="exmark ${st}">${{ ok: '○ 正解', ng: '× 不正解', blank: '未回答', nokey: '' }[st]}</span>
    </section>
    ${questionOf(c, q) ? '<section class="card qcard" id="exQ"></section>' : ''}
    ${e ? `<article class="card exbody">${e.blocks.map(b => exBlock(b, k, v)).join('')}${BOOK_ID === 2
      ? '<p class="exfoot">公式テキストのページは、過去問題集の解説から推定したものです。(?) は確かさ 中、(??) は 低。'
        + '「索引」は、選択肢や解説に出てくる用語を公式テキストの索引で引いたページです。</p>' : ''}</article>` : `
      <section class="card notice">
        <b>解説データがまだ登録されていません</b>
        <p>解説つきの取り込み用リンク（…&amp;ex=…）を「正解データ」画面に貼り付けると読み込めます。</p>
        <button class="secondary" data-act="toKey">正解データ画面へ</button>
      </section>`}
    <nav class="exnav">
      <button class="nav-btn" data-act="exPrev"${i > 0 ? '' : ' disabled'}>${ICON.back}前の問題</button>
      <button class="nav-btn" data-act="exNext"${i >= 0 && i < list.length - 1 ? '' : ' disabled'}>次の問題${ICON.next}</button>
    </nav>`;
  // 問題文には、回答画面で書いた手書きメモを重ねる（ここでは書けない）。正解は緑、間違えた答えは赤
  const host = $('#exQ');
  if (host) {
    attachInk(mountPaper(host, c, q, 1.25), s, c, q, false);
    ink.paper.querySelectorAll('[data-n]').forEach(el => {
      const n = Number(el.dataset.n);
      el.classList.toggle('is-ok', n === k);
      el.classList.toggle('is-ng', n === v && v !== k && !!k);
    });
  }
}

function exBlock(b, k, v) {
  const ref = b.ref ? `<span class="exref">▶ ${esc(b.ref)}</span>` : '';
  if (b.type === 'item' && b.level === 2) {
    // 選択肢の説明の中の箇条書き。選択肢と同じ ①② が使われていても、正解の印は付けない
    return `<div class="exitem sub"><span class="exitem-mark">${esc(b.mark)}</span><div>${rich(b.text)}${ref}</div></div>`;
  }
  if (b.type === 'item') {
    const n = CIRCLED[b.mark];
    const tag = n && n === k ? '<span class="extag ok">正解</span>'
              : n && n === v ? '<span class="extag ng">あなたの答え</span>' : '';
    // 先頭の「適切である。」「不適切である。」を太字に
    // 先頭の「適切である。」「不適切である。」を太字に。テキスト問題集は判定（verdict）が別にある
    const text = b.verdict ? `<b>${esc(b.verdict)}</b>${b.text ? `　${rich(b.text)}` : ''}`
      : rich(b.text).replace(/^((?:出題時点では)?(?:不適切|適切)である。)/, '<b>$1</b>');
    return `<div class="exitem${n && n === k ? ' is-ans' : ''}"><span class="exitem-mark">${esc(b.mark)}</span><div>${tag}${text}${ref}</div></div>`;
  }
  if (b.type === 'note') return `<div class="exnote">${rich(b.text)}${ref}</div>`;
  if (b.type === 'table') {
    const rows = (b.rows || []).map(r => `<tr>${r.map(x => `<td>${rich(x)}</td>`).join('')}</tr>`).join('');
    return `<div class="extable">${b.title ? `<div class="extable-title">${rich(b.title)}</div>` : ''}<table>${rows}</table>${ref}</div>`;
  }
  return `<p class="expara">${rich(b.text)}${ref}</p>`;
}

function moveEx(d) {
  const list = exList(current);
  const i = list.findIndex(([a, b]) => a === exPos.c && b === exPos.q);
  const t = list[i + d];
  if (i < 0 || !t) return;
  exPos = { c: t[0], q: t[1] };
  history.replaceState(history.state, '', `#/s/${current.id}/ex/${t[0] + 1}-${t[1] + 1}`);
  paintEx();
  window.scrollTo(0, 0);
}

/* ===== 正解データ ===== */
let pendingKey = null;   // 読み取って、登録の確認を待っている正解
let pendingEx = null;    // 読み取った解説の鍵

// 10問ずつ区切って表示（正解不明は -）
const keyGroups = a => a.map(v => v || '-').join('').replace(/(.{10})(?=.)/g, '$1 ');

function renderKey() {
  view.innerHTML = `
    ${bar('正解データ', `${BOOK.name} · ${HAS_KEY ? `${keyCount()} / ${TOTAL} 問 登録済み` : '未登録'}`)}
    <section class="card ch">
      <div class="ch-head"><b>取り込む</b></div>
      <p class="key-help">取り込み用のリンク、または正解の数字を貼り付けて「読み取る」を押してください。</p>
      <textarea id="keyText" rows="5" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="例）https://…#key=3142…&#10;または&#10;第1章: 3142231441 2314…&#10;第2章: …"></textarea>
      <p class="err" id="keyErr" role="alert"></p>
      <button class="primary wide" data-act="readKey">読み取る</button>
    </section>
    <h2 class="sec">登録されている正解</h2>
    <section class="card chs">
      ${KEY.map((a, c) => `
        <div class="keyrow">
          <b>第${c + 1}章</b>
          ${a ? `<code>${keyGroups(a)}</code>` : '<span class="off">未登録</span>'}
        </div>`).join('')}
    </section>
    ${HAS_KEY ? '<button class="text-danger" data-act="clearKey">正解データを削除する</button>' : ''}
    <h2 class="sec">問題文・解説</h2>
    <section class="card ch">
      <div class="ch-head"><b>問題文・解説データ</b><span class="num">${EX ? exSummary(EX) : '未登録'}</span></div>
      <p class="key-help">${EX ? `${hasQuestions() ? '回答画面に問題文が出ます。' : ''}○付け画面で問題をタップすると解説を開けます。`
        : '解説つきの取り込み用リンク（…&amp;ex=…）を上の欄に貼り付けると、問題文と解説も一緒に読み込みます（通信が必要です）。'}</p>
      ${getExKey() ? '<button class="secondary wide" data-act="reloadEx">解説を読み込み直す</button>' : ''}
    </section>
    ${EX ? '<button class="text-danger" data-act="clearEx">解説データを削除する</button>' : ''}
    <p class="foot">正解データ・問題文・解説・手書きメモは、この端末のブラウザにだけ保存されます。</p>`;
}

function exSummary(data) {
  const items = Object.values(data.items), nq = items.filter(it => it.question).length;
  return nq ? `問題文 ${nq}問・解説 ${items.length}問` : `解説 ${items.length}問 登録済み`;
}

async function importEx(keyText) {
  toast('問題文と解説を読み込んでいます…');
  try {
    const data = await fetchExplain(keyText);
    if (!saveEx(data, keyText)) return;
    toast(`読み込みました（${exSummary(data)}）`);
  } catch (e) {
    toast(e.message);
  }
  if (route().view === 'key') renderKey();
}

// 起動時: 解説の鍵があれば、新しい解説ファイルが出ていないかを裏で確かめる
async function refreshEx() {
  const k = getExKey();
  if (!k || navigator.onLine === false) return;
  try {
    const data = await fetchExplain(k);
    if (EX && data.built === EX.built) return;
    if (!saveEx(data, k)) return;
    // 開いている画面に反映する（回答画面は、問題文が入ったときに紙面へ切り替わる）
    const v = route().view;
    if (v === 'ex' && current) paintEx();
    else if (v === 'q' && current) renderAnswer();
  } catch (e) { /* 通信できないときなどは手元の解説のまま */ }
}

/* ===== 操作 ===== */
const idOf = el => el.dataset.id || current.id;

const actions = {
  newSession() {
    const now = Date.now();
    const s = {
      id: now.toString(36) + Math.random().toString(36).slice(2, 6),
      createdAt: now, startedAt: null, updatedAt: null,
      answers: CHAPTERS.map(n => new Array(n).fill(0)),
      unsure: CHAPTERS.map(n => new Array(n).fill(0)),
      pos: { c: 0, q: 0 },
    };
    db.sessions.push(s);
    nav(`#/s/${s.id}`);
  },
  newMock() {
    const now = Date.now(), { items, ring: next } = drawMock(ring);
    const s = {
      id: now.toString(36) + Math.random().toString(36).slice(2, 6),
      createdAt: now, startedAt: null, updatedAt: null, endedAt: null,
      answers: CHAPTERS.map(n => new Array(n).fill(0)),
      unsure: CHAPTERS.map(n => new Array(n).fill(0)),
      times: CHAPTERS.map(n => new Array(n).fill(0)),
      elapsed: 0, items, ringNext: next,
      pos: { c: items[0][0], q: items[0][1] },
    };
    db.sessions.push(s);
    nav(`#/s/${s.id}/q`);
    toast(`${items.length}問・時間を計りはじめました`);
  },
  askEndMock(el) {
    const s = findSession(idOf(el));
    if (!s) return;
    const N = s.items.length, n = answered(s), inQ = route().view === 'q';
    openSheet(`
      <h2>実戦形式を終了しますか？</h2>
      <p class="num">${n ? `${N}問中 ${n}問に回答・経過 ${fmtClock(elapsedOf(s))}。${N - n ? `未回答の ${N - n}問は不正解として採点します。` : ''}終了すると、答えは直せなくなります。`
        : 'まだ1問も回答していません。終了すると記録に残らず、出題した問題も次の回にまわります。'}</p>
      <div class="btns">
        <button class="primary" data-act="endMock" data-id="${s.id}">${n ? '終了して採点する' : '終了する'}</button>
        <button data-act="closeSheet">${inQ ? '続ける' : 'やめる'}</button>
      </div>
      ${inQ ? '<p class="sheet-note">あとで続けるときは、左上の ‹ で中断できます（時間も止まります）。</p>' : ''}`);
  },
  endMock(el) {
    const s = findSession(idOf(el));
    if (!s) return;
    closeSheet();
    if (clock.s === s) clockOff();
    if (!answered(s)) {
      // 1問も答えていなければ記録しない（出題の記録も確定させない）
      db.sessions.splice(db.sessions.indexOf(s), 1);
      deleteInk(s.id);
      history.replaceState(null, '', '#/');
      render();
      toast('1問も回答していないので、記録しませんでした');
      return;
    }
    s.endedAt = s.updatedAt = Date.now();
    save();
    // 回答画面からなら、戻るで終わった回答画面に戻らないよう置き換える
    const hash = `#/s/${s.id}/grade`;
    if (route().view === 'q') { history.replaceState(history.state, '', hash); render(); window.scrollTo(0, 0); }
    else nav(hash);
  },
  open: el => nav(`#/s/${el.dataset.id}`),
  toList: el => nav(`#/s/${idOf(el)}/list`),
  toGrade: el => nav(`#/s/${idOf(el)}/grade`),
  del(el) {
    const s = findSession(el.dataset.id);
    if (!s) return;
    if (!confirm(`${fmtDate(dateOf(s))}の${isMock(s) ? '実戦形式の' : ''}記録（${answered(s)}問回答）を削除します。\n元に戻せません。よろしいですか？`)) return;
    db.sessions.splice(db.sessions.indexOf(s), 1);
    save();
    deleteInk(s.id);
    renderHome();
  },
  back() {
    const r = route(), s = r.id && findSession(r.id);
    // 実戦形式の親の画面は、解説なら結果、それ以外はホーム
    goBack(!s || r.view === 'hub' ? '#/' : !isMock(s) ? `#/s/${r.id}` : r.view === 'ex' ? `#/s/${r.id}/grade` : '#/');
  },
  toKey: () => nav('#/key'),
  book(el) {
    const id = Number(el.dataset.book);
    if (id !== BOOK_ID && !switchBook(id)) toast('切り替えられませんでした（ブラウザに保存できません）');
  },
  readKey() {
    const text = $('#keyText').value;
    // もう一方の問題集の取り込み用リンクなら、その問題集に切り替えてから取り込む
    if (/(?:^|[#&?\s])(?:key|ex|b)=/.test(text) && linkBook(text) !== BOOK_ID) {
      const frag = text.match(/#(\S+)/);
      if (switchBook(linkBook(text), '#' + (frag ? frag[1] : text.trim()))) return;
    }
    const ex = text.match(/(?:^|[#&?\s])ex=([A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])/);
    // 解説の鍵だけのリンク（key= がない）は、正解は読まない
    const r = ex && !/key=/.test(text) ? { chapters: null } : parseKey(text);
    $('#keyErr').textContent = r.error || '';
    pendingKey = r.error ? null : r.chapters;
    pendingEx = r.error || !ex ? null : ex[1];
    if (!pendingKey && !pendingEx) return;
    const label = (a, c) => {
      if (!a) return KEY[c] ? '変更なし' : '未登録のまま';
      const unknown = a.filter(v => !v).length;
      return `${a.length - unknown}問${unknown ? `（不明 ${unknown}問）` : ''}`;
    };
    openSheet(`
      <h2>この内容で登録しますか？</h2>
      <div class="sheet-list">
        ${pendingKey ? pendingKey.map((a, c) => `<div><span>第${c + 1}章</span><span class="num">${label(a, c)}</span></div>`).join('') : ''}
        ${pendingEx ? '<div><span>解説</span><span>読み込む（通信します）</span></div>' : ''}
      </div>
      <div class="btns">
        <button class="primary" data-act="applyKey">登録する</button>
        <button data-act="closeSheet">やめる</button>
      </div>`);
  },
  applyKey() {
    const nextKey = pendingKey && KEY.map((a, c) => pendingKey[c] || a), ex = pendingEx;
    pendingKey = pendingEx = null;
    closeSheet();
    if (nextKey) {
      if (!saveKey(nextKey)) return;
      toast('正解データを登録しました');
    }
    renderKey();
    if (ex) importEx(ex);
  },
  reloadEx() {
    const k = getExKey();
    if (k) importEx(k);
  },
  clearEx() {
    if (!confirm('読み込んだ解説を削除します。よろしいですか？\n（回答の記録と正解データは消えません）')) return;
    try { localStorage.removeItem(EX_STORE); localStorage.removeItem(EXKEY_STORE); } catch (e) { /* 無視 */ }
    EX = null;
    renderKey();
    toast('解説データを削除しました');
  },
  openEx: el => nav(`#/s/${current.id}/ex/${Number(el.dataset.c) + 1}-${Number(el.dataset.q) + 1}`),
  exPrev: () => moveEx(-1),
  exNext: () => moveEx(1),
  clearKey() {
    if (!confirm('登録されている正解データを削除します。よろしいですか？\n（回答の記録は消えません）')) return;
    if (saveKey(CHAPTERS.map(() => null))) { renderKey(); toast('正解データを削除しました'); }
  },
  resume: () => nav(`#/s/${current.id}/q`),
  block(el) {
    // そのブロックで最初の未回答から。全部答えてあればブロックの先頭から
    const c = Number(el.dataset.c), [from, to] = blockRange(c, Number(el.dataset.b));
    let q = from;
    for (let i = from; i < to; i++) if (!current.answers[c][i]) { q = i; break; }
    current.pos = { c, q };
    save();
    nav(`#/s/${current.id}/q`);
  },
  edit(el) {
    current.pos = { c: Number(el.dataset.c), q: Number(el.dataset.q) };
    save();
    nav(`#/s/${current.id}/q`);
  },
  inkTool(el) {
    inkTool = inkTool === el.dataset.tool ? '' : el.dataset.tool;   // 選んでいる道具をもう一度押すと閉じる
    if (inkTool && !inkHinted) { inkHinted = true; toast('ペンのあいだは画面が動きません'); }
    paintInkBar();
  },
  inkUndo() {
    if (!ink.history.length) return;
    ink.strokes = ink.history.pop();
    drawInk();
    saveInk();
  },
  inkClear() {
    if (!ink.strokes.length) return;
    ink.history.push(ink.strokes.slice());
    ink.strokes = [];
    drawInk();
    saveInk();
    toast('メモを消しました（↶ で戻せます）');
  },
  choose: el => choose(Number(el.dataset.v)),
  unsure: toggleUnsure,
  jump: el => setPos(Number(el.dataset.c), Number(el.dataset.q)),
  prev: goPrev,
  next: goNext,
  clear: clearAnswer,
  filter(el) { gradeFilter = el.dataset.f; renderGrade(current); },
  filterList(el) { listFilter = el.dataset.f; renderList(current); },
  toFirstBlank() {
    const p = firstBlank(current);
    closeSheet();
    if (p) setPos(p.c, p.q);
  },
  closeSheet,
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && actions[el.dataset.act]) actions[el.dataset.act](el);
});

// PC で試すとき用: 1〜4 で回答、? で自信なし、← → で移動、Backspace で取り消し
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#sheet')) { if (e.key === 'Escape') closeSheet(); return; }
  if (route().view === 'ex' && current) {
    if (e.key === 'ArrowLeft') moveEx(-1);
    else if (e.key === 'ArrowRight') moveEx(1);
    else if (e.key === 'Escape') actions.back();
    else return;
    e.preventDefault();
    return;
  }
  if (route().view !== 'q' || !current) return;
  if (/^[1-4]$/.test(e.key)) choose(Number(e.key));
  else if (e.key === '?' || e.key === '/') toggleUnsure();
  else if (e.key === 'ArrowRight') goNext();
  else if (e.key === 'ArrowLeft') goPrev();
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') clearAnswer();
  else if (e.key === 'Escape') actions.back();
  else return;
  e.preventDefault();
});

history.scrollRestoration = 'manual';
render();
refreshEx();
</script>
</body>
</html>
